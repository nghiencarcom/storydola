name: Publish StoryAI container

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create user installer release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p installer/scripts
          cp compose.yaml installer/
          cp README-USER.md installer/README.md
          cp "Start StoryAI.bat" "Start StoryAI.command" "Stop StoryAI.bat" "Stop StoryAI.command" installer/
          cp scripts/start-storyai.ps1 scripts/start-storyai.sh scripts/stop-storyai.ps1 scripts/stop-storyai.sh installer/scripts/
          image_ref="ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          sed "s|^STORYAI_IMAGE=ghcr.io/OWNER/REPOSITORY:latest$|STORYAI_IMAGE=${image_ref}|" .env.docker.example > installer/.env.docker.example
          (cd installer && zip -qr ../storyai-installer.zip .)
          gh release create "$GITHUB_REF_NAME" storyai-installer.zip \
            --title "StoryAI $GITHUB_REF_NAME" \
            --generate-notes
