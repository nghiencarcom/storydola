name: One-time cleanup of old StoryDola versions

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-legacy-versions.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete confirmed old releases and tags
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tags=(v0.1.4 v0.1.5 v0.1.6 v0.1.7 v0.1.8 v0.1.9 v1.0.0)
          for tag in "${tags[@]}"; do
            release_json="$(gh api "repos/${REPOSITORY}/releases/tags/${tag}" 2>/dev/null || true)"
            release_id="$(printf '%s' "$release_json" | jq -r '.id // empty' 2>/dev/null || true)"
            if [[ -n "$release_id" ]]; then
              gh api --method DELETE "repos/${REPOSITORY}/releases/${release_id}" >/dev/null
            fi
            if gh api --method DELETE "repos/${REPOSITORY}/git/refs/tags/${tag}" >/dev/null 2>&1; then
              echo "Deleted tag ${tag}"
            elif gh api "repos/${REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
              echo "Failed to delete tag ${tag}" >&2
              exit 1
            else
              echo "Tag ${tag} is already absent"
            fi
          done
